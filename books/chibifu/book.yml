title: "赤壁赋"
type: picture-book
status: completed
language: zh
description: "壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。水墨写意漫画把千古《赤壁赋》画成一册：从「清风徐来，水波不兴」到「托遗响于悲风」，六幅全本，附「月出于东山之上」中插页。"
cover: cover.webp
tags: ["水墨", "古文", "苏轼"]
title_en: "Ode to the Red Cliffs"
description_en: "Su Shi and his guest drift beneath the Red Cliff in a tiny boat. Ink-wash comics render the classic fu from 'a clear breeze comes, the water stays calm' to 'entrusting my lingering grief to the sad wind' — six plates, with an interlude: the moon rises above the eastern hills."
