title: "Your Life Is a Video Game"
type: picture-book
status: completed
language: en
description: "A stick-figure field guide to fixing your life, adapted from Dan Koe's 244M-view essay. Professor Pixel shows why resolutions fail (92%!), how all behavior is goal-directed (even procrastination), and how to turn your life into a game: vision as win condition, anti-vision as stakes, a 1-year mission, monthly boss fights, daily quests, and constraints as the force field against distraction. One page. One day. Press start."
descriptionZh: "火柴人讲透'把人生变成游戏'：基于 Dan Koe 2.4 亿浏览长文的结构化改编。为什么新年计划 92% 会失败（问题不在自律在身份）、一切行为都是目标导向（拖延也在追求某物）、以及游戏化目标层级——愿景是胜利条件、反愿景是赌注、1 年目标=主线、月度项目=Boss 战、每日任务=quest、约束=力场规则。一页纸，一天写完，按开始键。"
