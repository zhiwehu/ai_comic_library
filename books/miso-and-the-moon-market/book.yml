title_en: "Miso and the Moon Market"
description_en: "Miso the cat lives in a white lighthouse by the sea. One night the moon slides down onto the water and becomes a lantern-lit market — she tiptoes down the spiral stairs and steps onto the silver sea. Eight spreads of one moonlit market night."
