description: "小猫 Miso 住在海边的白灯塔里。一天夜里，月亮缓缓滑落海面，变成一座灯笼点亮的集市——她踮脚走过旋转楼梯，踩着云朵台阶，走进银色的海。八个跨页的月亮集市之夜。"
