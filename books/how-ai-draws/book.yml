description_en: "How does AI image generation actually work? BUILDER and his robot assistant explain it in eight pages of stick figures: start from pure noise, denoise step by step, prompts become math guidance, the PROMPT to TEXT ENCODER to DENOISER to VAE assembly line, why SDXL / FLUX / DALL-E / MIDJOURNEY have different styles, latent-space compression, and the steps-for-quality tradeoff. XKCD-style black ink on white, with BUILDER wearing while(alive) { learn(); build(); }."
