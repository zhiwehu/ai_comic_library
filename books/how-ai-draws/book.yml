description: "AI 生图到底是怎么工作的？BUILDER 和他的机器人助手用八页火柴人漫画讲明白：从纯噪点开始 → 一步步去噪（denoising）→ 提示词变成数学引导 → PROMPT→TEXT ENCODER→DENOISER→VAE 四站流水线 → SDXL/FLUX/DALL-E/MIDJOURNEY 不同模型不同风格 → 潜空间压缩省算力 → 步数换质量的取舍。XKCD 风白底黑线，BUILDER 的代码 T 恤写着 while(alive){learn();build();}。"
