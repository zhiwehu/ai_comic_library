title_en: "996: Days of the Urban Workhorse"
description_en: "One day in the life of an urban workhorse, in photorealistic cinematic illustration. Li Wei, 28, a Chinese developer: the 6:30 alarm, the Line 10 crush, forty minutes of standup buzzwords, dinner at the desk, the 9 PM second shift, the last train home — and the two hours on Sunday night that belong to him alone."
